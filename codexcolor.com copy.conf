# ======= MAIN WEBSITE SERVER =======
server {
    server_name codexcolor.com www.codexcolor.com;

    root /var/www/codexcolor;
    index index.php index.html index.htm;

    # --- ADDED: GTM First-Party Tracking Configuration ---
    # We will route all traffic for /gtm/ through this location block
    location ~ ^/gtm(.*) {
        # Proxy requests to your local GTM server
        proxy_pass http://127.0.0.1:8080$1$is_args$args;

        # Essential headers
        proxy_set_header Host www.codexcolor.com; # Must be the main domain now
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept $http_accept;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    # --- END ADDED GTM CONFIG ---

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/codexcolor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codexcolor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.codexcolor.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = codexcolor.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name codexcolor.com www.codexcolor.com;
    return 404;
}