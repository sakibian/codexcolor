# ======= MAIN WEBSITE SERVER =======
server {
    server_name codexcolor.com www.codexcolor.com;

    root /var/www/codexcolor;
    index index.php index.html index.htm;

    # --- LEGACY /sgtm PATH REDIRECT ---
    # The site uses a dedicated subdomain for first-party GTM. Redirect any
    # requests aimed at the main domain's /sgtm/ or /sgtm-preview/ to the
    # canonical GTM subdomain so upstream only sees requests via the subdomain.
    location /sgtm/ {
        return 301 https://gtm.codexcolor.com$request_uri;
    }

    location /sgtm-preview/ {
        return 301 https://gtm.codexcolor.com$request_uri;
    }
    # --- END LEGACY REDIRECT ---


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/codexcolor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codexcolor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.codexcolor.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = codexcolor.com) {
        return 301 https://$host$request_uri;
    }

    # Redirect http gtm subdomain to https
    if ($host = gtm.codexcolor.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name codexcolor.com www.codexcolor.com gtm.codexcolor.com;
    return 404;
}

# ======= GTM SUBDOMAIN (first-party GTM) =======
server {
    listen 443 ssl;
    server_name gtm.codexcolor.com;

    # Proxy all GTM requests to the server-side GTM containers
    location / {
        # If preview query present, forward to preview container
        if ($arg_gtm_preview) {
            proxy_pass http://127.0.0.1:8081/;
        }

        proxy_pass http://127.0.0.1:8080/;

        proxy_set_header gtm-auth $http_gtm_auth;
        proxy_set_header gtm-preview $http_gtm_preview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    ssl_certificate /etc/letsencrypt/live/gtm.codexcolor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtm.codexcolor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}